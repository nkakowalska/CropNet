[project]
authors = [{name = "Timothy Simons", email = "42070232+modiius@users.noreply.github.com"}]
dependencies = []
name = "CropNet"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64", "win-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
cropnet = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.3,<3"
huggingface_hub = ">=1.32.0,<2"
pandas = ">=3.0.6,<4"
geopandas = ">=1.2.0,<2"
pyarrow = ">=25.0.0,<26"
matplotlib = ">=3.11.2,<4"
pyogrio = ">=0.13.0,<0.14"
duckdb = ">=1.5.6,<2"
ipykernel = ">=7.4.0,<8"
python = ">=3.14.8,<3.15"
seaborn = ">=0.13.2,<0.14"
boruta_py = ">=0.3,<0.4"
